<!DOCTYPE html>
<!--
  ═══════════════════════════════════════════════════════════════
  Pickd 베타 랜딩페이지
  ✏️ 문구 수정   → <script> 최상단 COPY 객체에서 문자열만 바꾸세요
  🎨 디자인 수정 → <style> 최상단 :root CSS 변수만 바꾸세요
  🔀 켜고 끄기   → CONFIG 객체 (설문 표시, 모바일 CTA 바, 폼 전송 주소 등)
  ═══════════════════════════════════════════════════════════════
-->
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Pickd — 잡코리아에 없는 부산 기관 채용, 여기 다 있습니다</title>
<meta name="description" content="부산 지역기관 105곳 조사. 몰랐던 부산의 기관을 발견하고 고용형태·신입 초임·NCS·공고 채널까지 한눈에 확인하세요.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<style>
/* ═══════════════ 디자인 토큰 — 여기서만 수정 ═══════════════ */
:root{
  /* Base */
  --bg-white:#FFFFFF;
  --bg-tint:#F4F8FE;
  /* 1) 라이트 미스틱 블루 */
  --blue-100:#DCE9FF;
  --blue-300:#A9C9FF;
  --blue-500:#7DA7F4;
  --blue-600:#5B8DEF; /* 텍스트용 진한 블루(대비 확보) */
  /* 2) 민트 → 그린 */
  --mint-200:#CFF5EA;
  --mint-400:#A8EBD9;
  --green-500:#34C48E;
  /* 3) 레몬 — 포인트 (전체의 5% 이하) */
  --lemon-400:#FFE27A;
  --lemon-500:#FFD84D;
  /* Text */
  --ink-900:#1E2A3B;
  --ink-600:#5B6B80;
  --ink-400:#93A1B5;
  /* Gradients */
  --grad-sky:linear-gradient(160deg,#F6F9FF 0%,#EDF4FF 48%,#F0FAF7 100%);
  --grad-sky-soft:linear-gradient(180deg,#E9F1FF 0%,#F4F8FE 60%,#EAF9F3 100%);
  --grad-solution:linear-gradient(160deg,#EAF9F3 0%,#E4EEFF 100%);
  --grad-text:linear-gradient(90deg,#5B8DEF,#34C48E);
  /* Spacing (8px 베이스) */
  --space-2:8px; --space-3:12px; --space-4:16px; --space-5:20px; --space-6:24px;
  --space-8:32px; --space-12:48px; --space-16:64px; --space-20:80px;
  --section-y:128px; --container:1120px;
  /* Radius */
  --r-sm:12px; --r-md:20px; --r-lg:28px; --r-pill:999px;
  /* Shadow */
  --shadow-sm:0 4px 16px rgba(90,141,239,.10);
  --shadow-md:0 12px 40px rgba(90,141,239,.14);
  --shadow-lg:0 24px 60px rgba(90,141,239,.18);
  /* Glass blur */
  --blur-chip:12px; --blur-card:24px; --blur-panel:30px;
  /* Type scale */
  --font-h1:56px; --font-h2:40px; --font-h3:22px; --font-body:17px;
  --font-caption:13px;
  /* Form */
  --input-border:#E2E9F4;
  --cta-h:52px;
}
@media (max-width:767px){
  :root{
    --font-h1:34px; --font-h2:28px; --font-h3:20px; --font-body:16px;
    --section-y:72px;
  }
}

/* ═══════════════ 베이스 ═══════════════ */
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  font-family:'Pretendard',-apple-system,sans-serif;
  color:var(--ink-900);
  background:var(--bg-white);
  font-size:var(--font-body);
  line-height:1.7;
  letter-spacing:-0.01em;
  word-break:keep-all; /* 한국어 단어 중간 줄바꿈 방지 */
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
img,svg{display:block;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;border:none;background:none;}
input{font-family:inherit;}
:focus-visible{outline:3px solid rgba(91,141,239,.6);outline-offset:2px;border-radius:4px;}

.container{max-width:var(--container);margin:0 auto;padding:0 clamp(20px,5vw,24px);}
section{position:relative;padding:var(--section-y) 0;}

h1{font-size:var(--font-h1);font-weight:800;line-height:1.15;letter-spacing:-0.03em;}
h2{font-size:var(--font-h2);font-weight:700;line-height:1.2;letter-spacing:-0.02em;}
h3{font-size:var(--font-h3);font-weight:700;line-height:1.3;letter-spacing:-0.02em;}
.sub{color:var(--ink-600);max-width:42em;}
.caption{font-size:var(--font-caption);font-weight:500;line-height:1.5;letter-spacing:0;color:var(--ink-400);}
.eyebrow{font-size:13px;font-weight:600;line-height:1;letter-spacing:0.06em;color:var(--blue-600);display:inline-block;margin-bottom:var(--space-4);}
.grad-text{background:var(--grad-text);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;}
.em-text{color:var(--blue-600);}
.center{text-align:center;}
.center .sub{margin-left:auto;margin-right:auto;}

/* ═══════════════ 글래스 ═══════════════ */
.glass{
  background:rgba(255,255,255,0.55);
  backdrop-filter:blur(var(--blur-card)) saturate(1.4);
  -webkit-backdrop-filter:blur(var(--blur-card)) saturate(1.4);
  border:1px solid rgba(255,255,255,0.7);
  border-radius:var(--r-md);
  box-shadow:var(--shadow-md),inset 0 1px 0 rgba(255,255,255,0.6);
}
.glass-chip{
  background:rgba(255,255,255,0.5);
  backdrop-filter:blur(var(--blur-chip)) saturate(1.3);
  -webkit-backdrop-filter:blur(var(--blur-chip)) saturate(1.3);
  border:1px solid rgba(255,255,255,0.7);
  border-radius:var(--r-pill);
  box-shadow:var(--shadow-sm);
}
.glass-panel{
  background:rgba(255,255,255,0.62);
  backdrop-filter:blur(var(--blur-panel)) saturate(1.4);
  -webkit-backdrop-filter:blur(var(--blur-panel)) saturate(1.4);
  border:1px solid rgba(255,255,255,0.75);
  border-radius:var(--r-lg);
  box-shadow:var(--shadow-lg),inset 0 1px 0 rgba(255,255,255,0.6);
}
@supports not (backdrop-filter:blur(1px)){
  .glass,.glass-chip,.glass-panel{background:rgba(255,255,255,0.85);}
}
.card-hover{transition:transform .3s ease,box-shadow .3s ease;}
.card-hover:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg),inset 0 1px 0 rgba(255,255,255,0.6);}

/* ═══════════════ 구름 & 오브 ═══════════════ */
.sky-layer{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0;}
.cloud{
  position:absolute;border-radius:50%;
  background:radial-gradient(closest-side,rgba(255,255,255,0.95),rgba(255,255,255,0) 70%);
  filter:blur(12px);
  animation:cloudFloat 30s ease-in-out infinite alternate;
}
.cloud::before,.cloud::after{
  content:'';position:absolute;border-radius:50%;
  background:radial-gradient(closest-side,rgba(255,255,255,0.9),rgba(255,255,255,0) 70%);
}
.cloud::before{width:70%;height:70%;left:-25%;top:22%;}
.cloud::after{width:60%;height:60%;right:-20%;top:30%;}
.cloud.faint{opacity:.3;filter:blur(16px);}
@keyframes cloudFloat{from{transform:translateX(0);}to{transform:translateX(18px);}}
.orb{position:absolute;border-radius:50%;filter:blur(50px);opacity:.28;animation:cloudFloat 38s ease-in-out infinite alternate-reverse;}

/* ═══════════════ 버튼 · 입력칸 · 칩 ═══════════════ */
.btn-primary{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  background:var(--blue-500);color:#fff;
  font-size:16px;font-weight:700;letter-spacing:-0.01em;
  border-radius:var(--r-pill);padding:16px 28px;min-height:var(--cta-h);
  box-shadow:var(--shadow-md);
  transition:transform .2s ease,box-shadow .2s ease,background .2s ease;
  white-space:nowrap;
}
.btn-primary:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);background:var(--blue-600);}
.btn-primary:active{transform:translateY(0);box-shadow:var(--shadow-sm);}
.btn-primary.hero-cta{font-size:17px;padding:18px 40px;min-height:58px;}
.link-plain{color:var(--blue-600);font-weight:600;font-size:15px;border-bottom:1px solid transparent;transition:border-color .2s;}
.link-plain:hover{border-bottom-color:var(--blue-600);}

.email-form{display:flex;gap:var(--space-3);width:100%;max-width:520px;}
.email-form input[type="email"]{
  flex:1;min-width:0;height:var(--cta-h);
  background:#fff;border:1px solid var(--input-border);border-radius:var(--r-pill);
  padding:0 20px;font-size:16px;color:var(--ink-900);
  transition:border-color .2s,box-shadow .2s;
}
.email-form input[type="email"]::placeholder{color:var(--ink-400);}
.email-form input[type="email"]:focus{
  outline:none;border-color:var(--blue-500);
  box-shadow:0 0 0 3px rgba(125,167,244,.25);
}
.form-error{display:none;color:#D9534F;font-size:13px;font-weight:500;margin-top:var(--space-2);}
.form-wrap.invalid .form-error{display:block;}
.micro{font-size:var(--font-caption);color:var(--ink-400);margin-top:var(--space-3);line-height:1.5;}
@media (max-width:767px){
  .email-form{flex-direction:column;}
  .email-form .btn-primary{width:100%;}
}

/* ═══════════════ 내비게이션 ═══════════════ */
.nav{
  position:fixed;top:0;left:0;right:0;z-index:80;height:64px;
  transition:background .3s,box-shadow .3s,border-color .3s;
  border-bottom:1px solid transparent;
}
.nav.scrolled{
  background:rgba(255,255,255,0.7);
  backdrop-filter:blur(var(--blur-chip)) saturate(1.3);
  -webkit-backdrop-filter:blur(var(--blur-chip)) saturate(1.3);
  border-bottom-color:rgba(125,167,244,.18);
}
.nav-inner{max-width:var(--container);margin:0 auto;height:64px;padding:0 clamp(20px,5vw,24px);display:flex;align-items:center;justify-content:space-between;gap:var(--space-4);}
.nav-menu{display:flex;gap:var(--space-8);align-items:center;}
.nav-menu a{font-size:15px;font-weight:500;color:var(--ink-600);transition:color .2s;}
.nav-menu a:hover{color:var(--ink-900);}
.nav .btn-primary{padding:10px 20px;min-height:40px;font-size:14px;}
@media (max-width:767px){.nav-menu{display:none;}}

.logo{display:inline-flex;align-items:center;gap:8px;font-size:20px;font-weight:700;color:var(--ink-900);letter-spacing:-0.02em;}
.logo svg{width:22px;height:22px;}

/* ═══════════════ Hero ═══════════════ */
.hero{
  background:var(--grad-sky);
  padding-top:calc(64px + var(--space-16));
  padding-bottom:0;overflow:hidden;
}
.hero-inner{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;text-align:center;}
.hero-badge{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;font-size:13px;font-weight:600;color:var(--ink-900);border:1px solid rgba(255,216,77,.55);margin-bottom:var(--space-6);}
.hero h1{margin-bottom:var(--space-6);white-space:pre-line;}
.hero .sub{margin-bottom:var(--space-8);white-space:pre-line;}
.hero-slogan{font-size:14px;font-weight:600;color:var(--blue-600);margin-bottom:var(--space-3);letter-spacing:0.02em;}
.hero-form-wrap{width:100%;display:flex;flex-direction:column;align-items:center;}
.hero .browse{margin-top:var(--space-6);}
.hero-mockup{position:relative;z-index:2;margin:var(--space-16) auto calc(-1 * var(--space-8));max-width:760px;width:100%;}
@media (max-width:767px){.hero-mockup{margin-top:var(--space-12);}}

/* ═══════════════ 목업 공통 (CSS 스켈레톤 UI) ═══════════════ */
.mock-frame{border-radius:var(--r-lg);padding:var(--space-3);}
.mock-bar{display:flex;gap:6px;padding:6px 6px 12px;}
.mock-bar i{width:10px;height:10px;border-radius:50%;display:block;}
.mock-bar i:nth-child(1){background:#FF8A80;}
.mock-bar i:nth-child(2){background:var(--lemon-500);}
.mock-bar i:nth-child(3){background:var(--green-500);}
.mock-body{background:#fff;border-radius:var(--r-sm);padding:var(--space-4);text-align:left;box-shadow:inset 0 0 0 1px rgba(226,233,244,.8);}
.sk{background:#EDF2FA;border-radius:6px;height:10px;}
.sk.w40{width:40%;}.sk.w60{width:60%;}.sk.w80{width:80%;}
.mock-row{display:flex;align-items:center;gap:var(--space-3);padding:10px 12px;border-radius:10px;}
.mock-row + .mock-row{margin-top:6px;}
.mock-row.hot{background:rgba(255,226,122,.28);box-shadow:inset 0 0 0 1px rgba(255,216,77,.5);}
.mock-label{font-size:12.5px;font-weight:600;color:var(--ink-900);white-space:nowrap;}
.mock-sub{font-size:11.5px;color:var(--ink-400);white-space:nowrap;}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;border-radius:var(--r-pill);padding:3px 10px;white-space:nowrap;}
.chip.blue{background:var(--blue-100);color:#3B66C4;}
.chip.mint{background:var(--mint-200);color:#177A58;}
.chip.lemon{background:var(--lemon-400);color:#7A6410;}
.chip.gray{background:#EDF2FA;color:var(--ink-600);}
.dday{flex:none;white-space:nowrap;font-size:11px;font-weight:700;border-radius:var(--r-pill);padding:3px 9px;background:var(--blue-100);color:#3B66C4;}
.dday.urgent{background:var(--lemon-400);color:#7A6410;}

/* ═══════════════ Section 2 · 공감 ═══════════════ */
.sec-problem{background:var(--bg-white);}
.problem-grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-6);margin-top:var(--space-12);}
.problem-card{padding:var(--space-8);}
.problem-card h3{margin-bottom:var(--space-3);}
.problem-card p{color:var(--ink-600);font-size:15.5px;}
.problem-closing{margin-top:var(--space-16);text-align:center;font-size:clamp(26px,3.2vw,36px);font-weight:800;line-height:1.4;letter-spacing:-0.025em;white-space:pre-line;color:var(--ink-900);}
@media (max-width:767px){.problem-grid{grid-template-columns:1fr;}}

/* ═══════════════ Section 3 · 솔루션 ═══════════════ */
.sec-solution{background:var(--grad-solution);overflow:hidden;}
.demo-flow{margin-top:var(--space-12);position:relative;z-index:2;}
.demo-exp-chip{display:inline-flex;align-items:center;gap:8px;padding:10px 20px;font-size:14px;font-weight:600;color:var(--ink-900);}
/* Before 카드 — 업로드한 경험 메모 파일 느낌 */
.demo-before{max-width:880px;margin:0 auto;padding:var(--space-4);text-align:left;background:rgba(255,255,255,0.42);border-style:dashed;border-color:rgba(147,161,181,.55);}
/* BEFORE / AFTER 라벨 — 동일한 알약 버튼 모양 (중앙 정렬) */
.demo-label-row{text-align:center;margin-bottom:var(--space-4);}
.demo-pill{display:inline-flex;align-items:center;font-size:13px;font-weight:800;letter-spacing:.04em;border-radius:var(--r-pill);padding:8px 20px;}
.demo-pill.before{background:rgba(255,255,255,0.72);border:1px solid rgba(147,161,181,.28);color:var(--ink-400);}
.demo-pill.after{background:var(--blue-500);color:#fff;box-shadow:var(--shadow-sm);}
.memo{background:#fff;border:1px solid var(--input-border);border-radius:var(--r-sm);padding:var(--space-5) var(--space-6);box-shadow:var(--shadow-sm);}
.memo-head{display:flex;align-items:center;gap:8px;margin-bottom:var(--space-4);}
.memo-ic{flex:none;width:22px;height:22px;}
.memo-ic svg{width:22px;height:22px;}
.memo-name{font-size:13.5px;font-weight:700;color:var(--ink-600);}
.memo-uploaded{margin-left:auto;display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;color:#157150;background:var(--mint-200);border-radius:var(--r-pill);padding:4px 11px;white-space:nowrap;}
.memo-uploaded svg{width:13px;height:13px;}
.memo-title{font-size:14.5px;font-weight:700;color:var(--ink-900);margin-bottom:10px;}
.memo-body{color:var(--ink-600);font-size:15px;line-height:1.75;}
.demo-steps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:var(--space-4);}
.demo-step-chip{display:flex;align-items:center;gap:10px;background:#F7FAFF;border:1px solid #E6EEF9;border-radius:16px;padding:12px 14px;}
.demo-step-no{flex:none;width:26px;height:26px;border-radius:50%;background:var(--blue-100);color:var(--blue-600);display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;}
.demo-step-chip span:last-child{font-size:14px;font-weight:650;color:var(--ink-700);line-height:1.4;}
/* Before → After 화살표 구분자 */
.demo-divider{display:flex;flex-direction:column;align-items:center;gap:8px;margin:var(--space-6) 0;}
.demo-arrow{font-size:24px;font-weight:800;line-height:1;color:var(--blue-500);animation:arrowBob 2.2s ease-in-out infinite;}
@keyframes arrowBob{0%,100%{transform:translateY(0);}50%{transform:translateY(5px);}}
.demo-grid{display:grid;grid-template-columns:1fr;gap:var(--space-6);max-width:880px;margin-left:auto;margin-right:auto;}
.demo-card{padding:var(--space-8);text-align:left;background:rgba(255,255,255,0.88);}
.demo-card .org{display:inline-block;font-size:13px;font-weight:700;color:var(--blue-600);background:var(--blue-100);border-radius:var(--r-pill);padding:5px 14px;margin-bottom:var(--space-4);}
.demo-card-title{font-size:15px;font-weight:700;color:var(--ink-900);margin-bottom:14px;}
.demo-stat-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:16px;}
.demo-stat{background:#F7FAFF;border:1px solid #E6EEF9;border-radius:16px;padding:14px 16px;}
.demo-stat .k{display:block;font-size:12px;font-weight:700;color:var(--ink-500);margin-bottom:6px;}
.demo-stat .v{display:block;font-size:18px;font-weight:800;color:var(--ink-900);line-height:1.35;}
.demo-stat .v strong{color:#2E5AB8;}
.demo-source,.demo-summary{display:flex;gap:10px;align-items:flex-start;border-radius:14px;padding:12px 14px;}
.demo-source{background:#F8FBFF;border:1px solid #E8F0FD;margin-bottom:10px;}
.demo-summary{background:#FFF9E8;border:1px solid #FFE9A8;}
.demo-row-label{flex:none;font-size:12px;font-weight:800;color:var(--ink-500);margin-top:2px;}
.demo-row-text{font-size:14px;font-weight:700;color:var(--ink-900);line-height:1.6;}
.demo-caption{text-align:center;margin-top:var(--space-6);}
@media (max-width:767px){.demo-steps,.demo-stat-grid{grid-template-columns:1fr;} .demo-step-chip{padding:11px 12px;} .demo-stat .v{font-size:16px;} }
/* 프로세스 — 독립 섹션 (기존 흰 배경 사용) */
.sec-process{background:var(--bg-white);}
.process-head{margin-bottom:var(--space-12);}
.process-title{margin-top:var(--space-3);white-space:pre-line;}
.steps{display:flex;align-items:stretch;justify-content:center;gap:var(--space-3);}
.step{flex:1;padding:var(--space-6);text-align:left;}
.step-head{display:flex;align-items:center;gap:12px;margin-bottom:var(--space-4);}
.step .num{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;background:var(--blue-500);color:#fff;font-size:15px;font-weight:700;box-shadow:var(--shadow-sm);flex:none;}
.step h4{font-size:18px;font-weight:700;margin:0;color:var(--ink-900);}
.step p{color:var(--ink-600);font-size:14.5px;}
.step-arrow{flex:none;align-self:center;font-size:24px;font-weight:800;color:var(--blue-300);}
.mid-cta{margin-top:var(--space-16);text-align:center;position:relative;z-index:2;}
@media (max-width:767px){
  .demo-grid{grid-template-columns:1fr;}
  .steps{flex-direction:column;gap:var(--space-2);}
  .step-arrow{transform:rotate(90deg);align-self:center;}
}

/* ═══════════════ Section 4 · 기능 ═══════════════ */
.sec-features{background:var(--bg-tint);}
.feature-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--space-6);margin-top:var(--space-12);}
.feature-card{position:relative;padding:var(--space-8) var(--space-6);display:flex;flex-direction:column;gap:var(--space-3);}

.feature-card h3{white-space:pre-line;margin-bottom:2px;}
.feature-card > p{color:var(--ink-600);font-size:15px;margin-bottom:var(--space-2);}
/* 목업 — 윈도우 프레임(3점 바) */
.feature-screen{margin-top:auto;background:#fff;border:1px solid var(--input-border);border-radius:var(--r-md);box-shadow:var(--shadow-sm);overflow:hidden;}
.mock-topbar{display:flex;gap:5px;padding:9px 13px;background:#FAFCFF;border-bottom:1px solid #EFF3FA;}
.mock-topbar i{width:8px;height:8px;border-radius:50%;}
.mock-topbar i:nth-child(1){background:#FFB4AC;}
.mock-topbar i:nth-child(2){background:#FFE0A3;}
.mock-topbar i:nth-child(3){background:#A8E6CC;}
.feature-mock{padding:var(--space-4);}
.fm-btn{display:inline-block;font-size:11px;font-weight:700;color:#fff;background:var(--blue-500);border-radius:var(--r-pill);padding:5px 12px;}
.fm-title{font-size:12px;font-weight:700;color:var(--ink-900);margin-bottom:8px;}
.fm-panel{background:var(--bg-tint);border-radius:8px;padding:8px;}
.match{font-size:10.5px;font-weight:700;color:#177A58;background:var(--mint-200);border-radius:var(--r-pill);padding:2px 8px;}
.mini-cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-top:8px;}
.mini-cal i{display:block;aspect-ratio:1;border-radius:4px;background:#EDF2FA;}
.mini-cal i.mark{background:var(--blue-300);}
.mini-cal i.hot{background:var(--lemon-400);}
@media (max-width:1023px){.feature-grid{grid-template-columns:1fr;max-width:560px;margin-left:auto;margin-right:auto;}}

/* ═══════════════ Section 5 · 커버리지 ═══════════════ */
.sec-coverage{background:var(--bg-white);overflow:hidden;}
.coverage-checks{max-width:620px;margin:var(--space-12) auto 0;padding:var(--space-8);text-align:left;}
.coverage-checks ul{list-style:none;display:flex;flex-direction:column;gap:var(--space-5);}
.coverage-checks li{display:flex;align-items:center;gap:var(--space-4);font-size:16px;font-weight:600;color:var(--ink-900);}
.check-ic{flex:none;width:24px;height:24px;border-radius:50%;background:var(--blue-100);color:var(--blue-600);display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;}
.marquee-zone{margin-top:var(--space-16);display:flex;flex-direction:column;gap:var(--space-4);}
.marquee{overflow:hidden;position:relative;-webkit-mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent);mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent);}
.marquee-track{display:flex;gap:var(--space-3);width:max-content;animation:marquee 42s linear infinite;}
.marquee.reverse .marquee-track{animation-direction:reverse;animation-duration:48s;}
.marquee:hover .marquee-track{animation-play-state:paused;}
@keyframes marquee{to{transform:translateX(-50%);}}
.org-chip{flex:none;font-size:14.5px;font-weight:750;color:var(--ink-900);padding:12px 22px;border-radius:var(--r-pill);background:rgba(255,255,255,.92);border:1px solid rgba(220,233,255,.95);box-shadow:0 6px 18px rgba(90,141,239,.08);}
.coverage-micro{text-align:center;margin-top:var(--space-6);}

/* ═══════════════ Section 7 · FAQ ═══════════════ */
.sec-faq{background:var(--bg-white);} /* 다른 콘텐츠 섹션과 동일한 흰 배경 */
.faq-list{max-width:720px;margin:var(--space-8) auto 0;display:flex;flex-direction:column;}
.faq-item{border-bottom:1px solid rgba(147,161,181,.22);}
.faq-item:first-child{border-top:1px solid rgba(147,161,181,.22);}
.faq-q{width:100%;display:flex;align-items:center;justify-content:space-between;gap:var(--space-4);padding:var(--space-5) var(--space-2);text-align:left;font-size:16px;font-weight:600;color:var(--ink-900);line-height:1.4;transition:color .2s;}
.faq-q:hover,.faq-item.open .faq-q{color:var(--blue-600);}
.faq-chevron{flex:none;width:22px;height:22px;color:var(--ink-400);transition:transform .3s ease,color .2s;}
.faq-chevron svg{width:22px;height:22px;}
.faq-item.open .faq-chevron{transform:rotate(180deg);color:var(--blue-500);}
.faq-a{max-height:0;overflow:hidden;transition:max-height .35s ease;}
.faq-a p{padding:0 var(--space-2) var(--space-5);color:var(--ink-600);font-size:15px;line-height:1.8;white-space:pre-line;}
@media (max-width:767px){.faq-q{font-size:15px;}}

.final-panel h2{white-space:pre-line;margin-bottom:var(--space-4);}
.final-panel > .sub{white-space:pre-line;margin:0 auto var(--space-6);}
.final-sun{position:absolute;left:50%;bottom:-180px;transform:translateX(-50%);width:520px;height:320px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,226,122,.5),rgba(255,226,122,0) 70%);filter:blur(40px);pointer-events:none;}

/* 소셜 프루프 */
.social-proof-badge{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.72);border:1px solid rgba(255,255,255,.86);border-radius:var(--r-pill);padding:5px 12px;font-size:13px;line-height:1.2;font-weight:650;color:var(--ink-600);box-shadow:var(--shadow-sm);backdrop-filter:blur(var(--blur-chip));-webkit-backdrop-filter:blur(var(--blur-chip));}

.hero-proof{margin-top:var(--space-4);}

/* 페이지 내 인라인 신청 폼 */

.reservation-required{font-size:11px;font-weight:700;color:var(--blue-600);margin-left:4px;vertical-align:1px;}
.status-opts{display:flex;flex-wrap:wrap;gap:8px;}
.status-opt{font-size:13.5px;font-weight:600;color:var(--ink-600);background:#fff;border:1px solid var(--input-border);border-radius:var(--r-pill);padding:8px 14px;transition:all .15s;}
.status-opt:hover{border-color:var(--blue-300);}
.status-opt.on{background:var(--blue-100);border-color:var(--blue-300);color:#315FB8;}

.signup-grid{display:grid;grid-template-columns:140px 1fr 1fr;gap:12px;align-items:start;}
.signup-field{min-width:0;}

.signup-input{position:relative;min-width:0;}

.signup-form .with-icon input{padding-left:44px;}

.signup-input:focus-within .in-ic{color:var(--blue-500);}
.reservation-form-error{display:none;color:#D9534F;font-size:13px;font-weight:600;margin:10px 4px 0;text-align:left;}
.signup-form.invalid .reservation-form-error{display:block;}
.privacy-consent{max-width:700px;margin:var(--space-5) auto 0;padding:14px 16px;background:#F8FBFF;border:1px solid var(--input-border);border-radius:14px;}
.privacy-consent-label{display:flex;align-items:flex-start;gap:10px;cursor:pointer;}
.privacy-consent input[type="checkbox"]{flex:none;width:18px;height:18px;margin-top:2px;accent-color:var(--blue-500);}
.privacy-consent-title{font-size:13.5px;font-weight:750;color:var(--ink-900);line-height:1.5;}
.privacy-consent-required{font-size:11px;font-weight:700;color:var(--blue-600);margin-right:4px;}
.privacy-consent-detail{margin:8px 0 0 28px;font-size:12.5px;line-height:1.65;color:var(--ink-600);}
.privacy-consent-error{display:none;margin:8px 0 0 28px;font-size:12.5px;font-weight:650;color:#D9534F;}
.signup-form.consent-invalid .privacy-consent{border-color:rgba(217,83,79,.45);background:#FFF9F8;}
.signup-form.consent-invalid .privacy-consent-error{display:block;}
.signup-submit{display:flex;justify-content:center;margin-top:var(--space-6);}
.signup-submit .btn-primary{height:54px;font-size:16.5px;padding-left:42px;padding-right:42px;}
.inline-micro{text-align:center;margin-top:var(--space-4);}

/* 신청 완료 + 인라인 설문 */
.inline-success{display:flex;align-items:center;justify-content:center;gap:12px;text-align:left;padding:6px 0 var(--space-4);}
.inline-success[hidden],.inline-survey[hidden],.signup-form[hidden],.inline-micro[hidden]{display:none!important;}
.done-ic{flex:none;width:46px;height:46px;border-radius:50%;background:var(--mint-200);display:flex;align-items:center;justify-content:center;}
.done-ic svg{width:25px;height:25px;}
.done-title{font-size:18px;font-weight:800;letter-spacing:-0.02em;margin-bottom:2px;}
.done-desc{font-size:13.5px;color:var(--ink-600);line-height:1.5;}
.inline-survey{margin-top:var(--space-5);padding-top:var(--space-6);border-top:1px solid rgba(147,161,181,.2);}
.survey-title{text-align:center;font-size:20px;font-weight:800;line-height:1.5;white-space:pre-line;margin-bottom:var(--space-6);}
.survey-q{margin-bottom:var(--space-6);}
.survey-q .q{font-size:14.5px;font-weight:700;margin-bottom:var(--space-3);}
.chip-opts{display:flex;flex-wrap:wrap;gap:var(--space-2);}
.chip-opt{font-size:13.5px;font-weight:500;color:var(--ink-600);background:#F4F8FE;border:1px solid var(--input-border);border-radius:var(--r-pill);padding:9px 16px;transition:all .15s;min-height:38px;}
.chip-opt:hover{border-color:var(--blue-300);}
.chip-opt.on{background:var(--blue-500);border-color:var(--blue-500);color:#fff;font-weight:600;}
.survey-q input[type="text"]{width:100%;height:46px;background:#fff;border:1px solid var(--input-border);border-radius:var(--r-sm);padding:0 14px;font-size:14px;}
.survey-q input[type="text"]:focus{outline:none;border-color:var(--blue-500);box-shadow:0 0 0 3px rgba(125,167,244,.25);}
.inline-survey .btn-primary{width:100%;}
.survey-thanks{text-align:center;font-size:18px;font-weight:700;padding:var(--space-8) 0 var(--space-2);}

@media (max-width:767px){
  .problem-closing{font-size:clamp(23px,7vw,30px);}
  .inline-signup{padding:var(--space-6) var(--space-4);}
  .reservation-benefits{grid-template-columns:1fr;gap:8px;}
  .reservation-benefit{text-align:left;}
  .signup-grid{grid-template-columns:1fr;gap:14px;}
  .signup-submit .btn-primary{width:100%;}
  .inline-success{align-items:flex-start;}
}

/* ═══════════════ 푸터 ═══════════════ */
.footer{padding:var(--space-12) 0 calc(var(--space-12) + 72px);background:var(--bg-tint);}

.ig-link:hover{border-bottom-color:#E1306C;}
.footer .caption{margin-top:var(--space-2);}
@media (min-width:768px){.footer{padding-bottom:var(--space-12);}}

}
.mobile-cta .btn-primary{width:100%;}

/* ═══════════════ 스크롤 진입 모션 ═══════════════ */
.reveal{opacity:0;transform:translateY(24px);transition:opacity .6s ease-out,transform .6s ease-out;}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none !important;transition:none !important;}

}

      o.querySelector('.faq-q').setAttribute('aria-expanded', 'false');
      o.querySelector('.faq-a').style.maxHeight = null;
    });
    if (willOpen) {
      item.classList.add('open');
      btn.setAttribute('aria-expanded', 'true');
      ans.style.maxHeight = ans.scrollHeight + 'px';
    }
  });
});

/* 모바일 하단 고정 CTA 바 */
const mobileCta = document.getElementById('mobileCta');
if (CONFIG.showMobileCtaBar) {
  mobileCta.classList.add('enabled');
  mobileCta.innerHTML = `<button type="button" class="btn-primary" data-open-signup>${esc(COPY.mobileCta)}</button>`;
}

/* ─────────── 동작: 내비 스크롤 글래스 ─────────── */
const nav = document.getElementById('nav');
const onScroll = () => nav.classList.toggle('scrolled', window.scrollY > 60);
window.addEventListener('scroll', onScroll, { passive: true });
onScroll();

/* ─────────── 데이터 기록 ─────────── */
const leads = []; // 메모리 기록 (개발 확인용)
const validEmail = v => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.trim());
// 전화번호: 숫자 9~11자리 (하이픈·공백 허용). 예) 010-1234-5678
const validPhone = v => /^\d{9,11}$/.test(v.replace(/[\s-]/g,''));
// 이메일 또는 전화번호 허용
const validContact = v => validEmail(v) || validPhone(v);

async function submitLead(payload) {
  leads.push(payload);
  console.log('[Pickd] 신청/설문 데이터:', payload);
  if (CONFIG.formEndpoint) {
    try {
      const res = await fetch(CONFIG.formEndpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      const data = await res.json().catch(() => null);
      return data;
    } catch (err) { console.warn('[Pickd] 전송 실패(로컬에는 기록됨):', err); }
  }
  return null;
}

/* ─────────── 사전예약: 인라인 폼 → 인라인 미니 설문 ─────────── */
const COUNT_KEY = 'pickdSignupCountV1';
const CONTACT_KEY = 'pickdSignupContactsV1';
const answers = {};
let currentEmail = '';

function getSignupCount() {
  const saved = Number(localStorage.getItem(COUNT_KEY));
  return Number.isFinite(saved) && saved >= CONFIG.initialSignupCount ? saved : CONFIG.initialSignupCount;
}
function setSignupCount(count) {
  localStorage.setItem(COUNT_KEY, String(count));
  document.querySelectorAll('[data-signup-count]').forEach(el => el.textContent = String(count));
}
function updateSignupCountUI() { setSignupCount(getSignupCount()); }
function countNewSignup(contact) {
  let contacts = [];
  try { contacts = JSON.parse(localStorage.getItem(CONTACT_KEY) || '[]'); } catch (_) {}
  const normalized = contact.trim().toLowerCase();
  if (!contacts.includes(normalized)) {
    contacts.push(normalized);
    localStorage.setItem(CONTACT_KEY, JSON.stringify(contacts));
    setSignupCount(getSignupCount() + 1);
  }
}
updateSignupCountUI();

/* 모든 CTA는 신청 섹션으로 부드럽게 이동 */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-open-signup]');
  if (!t) return;
  e.preventDefault();
  document.getElementById('apply')?.scrollIntoView({ behavior: 'smooth', block: 'center' });
  setTimeout(() => document.getElementById('reservationAge')?.focus(), 650);
});

const reservationForm = document.getElementById('reservationForm');
const reservationSuccess = document.getElementById('reservationSuccess');
const reservationMicro = document.getElementById('reservationMicro');
const reservationFields = document.getElementById('reservationFields');
const inlineSurvey = document.getElementById('inlineSurvey');
let reservationSchool = '';
let reservationPrep = '';

document.querySelectorAll('#reservationSchoolOptions .status-opt').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#reservationSchoolOptions .status-opt').forEach(b => b.classList.remove('on'));
    btn.classList.add('on');
    reservationSchool = btn.dataset.school || '';
  });
});

document.querySelectorAll('#reservationPrepOptions .status-opt').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#reservationPrepOptions .status-opt').forEach(b => b.classList.remove('on'));
    btn.classList.add('on');
    reservationPrep = btn.dataset.prep || '';
  });
});

document.getElementById('privacyConsent')?.addEventListener('change', e => {
  if (e.target.checked) reservationForm?.classList.remove('consent-invalid');
});

reservationForm?.addEventListener('submit', async ev => {
  ev.preventDefault();
  const ageInput = reservationForm.querySelector('input[name="age"]');
  const emailInput = reservationForm.querySelector('input[name="email"]');
  const phoneInput = reservationForm.querySelector('input[name="phone"]');
  const consentInput = reservationForm.querySelector('input[name="privacyConsent"]');
  const age = Number(ageInput.value);
  const email = emailInput.value.trim();
  const phone = phoneInput.value.trim();
  const ageValid = Number.isInteger(age) && age >= 18 && age <= 39;
  const emailValid = validEmail(email);
  const phoneValid = validPhone(phone);

  const consentValid = Boolean(consentInput?.checked);

  if (!ageValid || !emailValid || !phoneValid || !reservationSchool || !reservationPrep || !consentValid) {
    reservationForm.classList.add('invalid');
    reservationForm.classList.toggle('consent-invalid', !consentValid);
    if (!ageValid) ageInput.focus();
    else if (!emailValid) emailInput.focus();
    else if (!phoneValid) phoneInput.focus();
    else if (!consentValid) consentInput?.focus();
    return;
  }

  reservationForm.classList.remove('invalid');
  reservationForm.classList.remove('consent-invalid');
  currentEmail = email;
  const serverData = await submitLead({
    type: 'signup',
    age,
    email,
    phone,
    schoolStatus: reservationSchool,
    prepStage: reservationPrep,
    privacyConsent: true,
    privacyConsentAt: new Date().toISOString(),
    at: new Date().toISOString()
  });
  const serverCount = Number(serverData?.signupCount);
  if (Number.isFinite(serverCount) && serverCount >= CONFIG.initialSignupCount) setSignupCount(serverCount);
  else countNewSignup(email);
  reservationForm.hidden = true;
  reservationMicro.hidden = true;
  reservationSuccess.hidden = false;
  if (CONFIG.showSurvey) renderInlineSurvey();
});

function renderInlineSurvey() {
  answers.wish = '';
  COPY.survey.questions.forEach(q => answers[q.id] = null);
  inlineSurvey.hidden = false;
  inlineSurvey.innerHTML = `
    <p class="survey-title">${esc(COPY.survey.successTitle)}</p>
    ${COPY.survey.questions.map(q => `
      <div class="survey-q" data-q="${q.id}">
        <p class="q">${esc(q.q)}</p>
        <div class="chip-opts">${q.options.map(o=>`<button type="button" class="chip-opt" data-val="${esc(o)}">${esc(o)}</button>`).join('')}</div>
      </div>`).join('')}
    <div class="survey-q">
      <p class="q">${esc(COPY.survey.freeQ.q)}</p>
      <input type="text" id="surveyWish" placeholder="${esc(COPY.survey.freeQ.placeholder)}" maxlength="120">
    </div>
    <button type="button" class="btn-primary" id="surveySubmit">${esc(COPY.survey.submit)}</button>`;

  inlineSurvey.querySelectorAll('.survey-q[data-q]').forEach(qEl => {
    qEl.querySelectorAll('.chip-opt').forEach(btn => {
      btn.addEventListener('click', () => {
        qEl.querySelectorAll('.chip-opt').forEach(b => b.classList.remove('on'));
        btn.classList.add('on');
        answers[qEl.dataset.q] = btn.dataset.val;
      });
    });
  });
  inlineSurvey.querySelector('#surveySubmit').addEventListener('click', async () => {
    const wishEl = inlineSurvey.querySelector('#surveyWish');
    answers.wish = wishEl ? wishEl.value.trim() : '';
    await submitLead({ type: 'survey', contact: currentEmail, ...answers, at: new Date().toISOString() });
    inlineSurvey.innerHTML = `<p class="survey-thanks">${esc(COPY.survey.thanks)}</p>`;
  });
}

/* ─────────── 스크롤 진입 모션 (IntersectionObserver + 80ms 스태거) ─────────── */
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
if (reduceMotion) {
  document.querySelectorAll('.reveal').forEach(el => el.classList.add('in'));
} else {
  const io = new IntersectionObserver(entries => {
    entries.forEach(en => {
      if (!en.isIntersecting) return;
      const siblings = [...en.target.parentElement.querySelectorAll(':scope > .reveal:not(.in)')];
      const idx = Math.max(0, siblings.indexOf(en.target));
      setTimeout(() => en.target.classList.add('in'), Math.min(idx, 5) * 80);
      io.unobserve(en.target);
    });
  }, { threshold: 0.12, rootMargin: '0px 0px -40px 0px' });
  document.querySelectorAll('.reveal').forEach(el => io.observe(el));
}
</script>
